<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tiên Hiệp Thủ Trụ - Tower Defense Mobile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #050508; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        #game-wrapper { width: 100%; max-width: 430px; height: 100vh; max-height: 932px; background: #0d0e12; display: flex; flex-direction: column; position: relative; border: 1px solid #2a2b36; overflow: hidden; }
        
        /* HUD Top Bar */
        #top-bar { background: linear-gradient(180deg, rgba(20,21,29,0.95), rgba(13,14,18,0.9)); padding: 8px 12px; border-bottom: 1px solid #ffcc0044; display: flex; justify-content: space-between; align-items: center; z-index: 5; }
        .hud-group { display: flex; gap: 6px; font-size: 11px; font-weight: bold; }
        .badge { background: #181a22; padding: 3px 8px; border-radius: 10px; border: 1px solid #333; display: flex; align-items: center; gap: 4px; }
        
        #canvas-container { flex: 1; width: 100%; position: relative; background: #0e111a; display: flex; justify-content: center; align-items: center; }
        canvas { width: 100%; height: 100%; display: block; }

        /* Panel Nâng Cấp Trụ Khi Click */
        #upgrade-panel { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(20,22,32,0.95); border: 1px solid #ffd700; border-radius: 8px; padding: 8px 14px; display: none; gap: 10px; align-items: center; z-index: 8; }
        #upgrade-panel button { background: linear-gradient(135deg, #fbc531, #e1b12c); border: none; padding: 6px 12px; border-radius: 5px; font-weight: bold; color: #000; font-size: 11px; cursor: pointer; }

        /* Bottom Controls */
        #bottom-panel { position: absolute; bottom: 0; left: 0; width: 100%; z-index: 5; background: linear-gradient(0deg, rgba(13,14,18,0.98) 90%, transparent); padding: 8px; display: flex; flex-direction: column; gap: 6px; }
        .build-row { display: flex; gap: 6px; justify-content: space-between; }
        .btn-build { flex: 1; padding: 8px 4px; background: #1f2233; border: 1px solid #ffcc0044; border-radius: 8px; color: #fff; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; }
        .btn-build span { display: block; font-size: 9px; color: #fbc531; margin-top: 2px; }

        nav { display: flex; justify-content: space-around; background: #14151d; border-top: 1px solid #2a2b36; padding: 6px 0; }
        .nav-item { background: none; border: none; color: #888; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; width: 25%; }
        .nav-item.active { color: #ffd700; font-weight: bold; }
        .nav-icon { font-size: 16px; }

        /* Modals */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,10,15,0.96); z-index: 10; display: none; flex-direction: column; }
        .modal-overlay.active { display: flex; }
        .modal-hdr { padding: 12px; background: #181a24; border-bottom: 1px solid #ffcc0033; display: flex; justify-content: space-between; align-items: center; }
        .modal-hdr h3 { color: #ffd700; font-size: 14px; }
        .btn-close { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }
        .modal-bdy { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }

        .item-card { background: #161822; border: 1px solid #2a2b36; border-radius: 8px; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
        .item-desc h4 { font-size: 13px; color: #fff; }
        .item-desc p { font-size: 10px; color: #aaa; margin-top: 2px; }
        .btn-buy { background: #fbc531; color: #000; border: none; padding: 6px 12px; border-radius: 5px; font-weight: bold; font-size: 11px; }
        .btn-topup { background: #00a8ff; color: #fff; border: none; padding: 6px 12px; border-radius: 5px; font-weight: bold; font-size: 11px; }
    </style>
</head>
<body>

<div id="game-wrapper">
    <!-- HUD Top Bar -->
    <div id="top-bar">
        <div class="hud-group">
            <div class="badge">🗺️ <span id="txt-map">Map 1</span></div>
            <div class="badge">❤️ <span id="txt-life">20</span></div>
            <div class="badge">🌊 Wave <span id="txt-wave">1/5</span></div>
        </div>
        <div class="hud-group">
            <div class="badge"><span style="color:#fbc531">🪙</span> <span id="txt-gold">200</span></div>
            <div class="badge"><span style="color:#00a8ff">💎</span> <span id="txt-gem">100</span></div>
        </div>
    </div>

    <!-- Canvas Game Screen -->
    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
        <div id="upgrade-panel">
            <span id="upgrade-info" style="font-size:11px;">Trụ Cấp 1</span>
            <button onclick="upgradeSelectedTower()">Nâng Cấp (<span id="upgrade-cost">100</span>🪙)</button>
            <button onclick="closeUpgradePanel()" style="background:#555; color:#fff;">✕</button>
        </div>
    </div>

    <!-- Control Build Panel -->
    <div id="bottom-panel">
        <div class="build-row">
            <button class="btn-build" onclick="selectTowerType('sword', 60)">⚔️ Kiếm Tháp<span>60 Vàng</span></button>
            <button class="btn-build" onclick="selectTowerType('thunder', 100)">⚡ Lôi Trụ<span>100 Vàng</span></button>
            <button class="btn-build" onclick="selectTowerType('ice', 90)">❄️ Băng Trận<span>90 Vàng</span></button>
        </div>
        <nav>
            <button class="nav-item active" onclick="closeAllModals()"><span class="nav-icon">🏰</span><span>Thủ Trụ</span></button>
            <button class="nav-item" onclick="openModal('bag')"><span class="nav-icon">🎒</span><span>Túi Đồ</span></button>
            <button class="nav-item" onclick="openModal('shop')"><span class="nav-icon">🏪</span><span>Cửa Hàng</span></button>
            <button class="nav-item" onclick="openModal('topup')"><span class="nav-icon">💳</span><span>Nạp Thẻ</span></button>
        </nav>
    </div>

    <!-- Modal Túi Đồ -->
    <div class="modal-overlay" id="modal-bag">
        <div class="modal-hdr">
            <h3>Túi Đồ Trang Bị (Drop 1%)</h3>
            <button class="btn-close" onclick="closeAllModals()">✕</button>
        </div>
        <div class="modal-bdy" id="bag-list">
            <p style="font-size:11px; color:#888; text-align:center;">Tiêu diệt Yêu Thú nhận trang bị hiếm.</p>
        </div>
    </div>

    <!-- Modal Cửa Hàng -->
    <div class="modal-overlay" id="modal-shop">
        <div class="modal-hdr">
            <h3>Cửa Hàng Tiên Các</h3>
            <button class="btn-close" onclick="closeAllModals()">✕</button>
        </div>
        <div class="modal-bdy">
            <div class="item-card">
                <div class="item-desc">
                    <h4>⚔️ Thần Binh Ỷ Thiên Kiếm</h4>
                    <p>Tăng +100% Sát Thương toàn bộ Trụ</p>
                </div>
                <button class="btn-buy" onclick="buyShopItem(200)">200 💎</button>
            </div>
        </div>
    </div>

    <!-- Modal Nạp Thẻ -->
    <div class="modal-overlay" id="modal-topup">
        <div class="modal-hdr">
            <h3>Nạp Kim Cương</h3>
            <button class="btn-close" onclick="closeAllModals()">✕</button>
        </div>
        <div class="modal-bdy">
            <div class="item-card">
                <div class="item-desc">
                    <h4>💎 Gói Cấp Tốc</h4>
                    <p>Nhận ngay 300 Kim Cương</p>
                </div>
                <button class="btn-topup" onclick="topup(300, '30.000 VNĐ')">30.000đ</button>
            </div>
        </div>
    </div>
</div>

<script>
    let state = {
        mapIndex: 0,
        gold: 200, gem: 100, life: 20, wave: 1, maxWave: 5,
        inventory: [], atkBuff: 1
    };

    // Load Sprite Images Mỹ Thuật
    const images = {};
    const imgSources = {
        monster: 'https://cdn-icons-png.flaticon.com/512/3063/3063822.png', // Yêu Thú Quái
        boss: 'https://cdn-icons-png.flaticon.com/512/1408/1408902.png',    // BOSS Rồng
        towerSword: 'https://cdn-icons-png.flaticon.com/512/941/941565.png', // Kiếm Tháp
        towerThunder: 'https://cdn-icons-png.flaticon.com/512/2822/2822366.png', // Lôi Trụ
        towerIce: 'https://cdn-icons-png.flaticon.com/512/1042/1042456.png' // Băng Trận
    };

    let loadedCount = 0;
    for(let key in imgSources) {
        images[key] = new Image();
        images[key].src = imgSources[key];
        images[key].onload = () => { loadedCount++; };
    }

    // Các Map Địa Hình
    const maps = [
        {
            name: "Tuyệt Tình Sơn (Map 1)",
            bgColor: "#0f141d",
            pathColor: "#1d2433",
            path: [{x:30,y:30},{x:360,y:30},{x:360,y:170},{x:70,y:170},{x:70,y:310},{x:360,y:310},{x:360,y:450},{x:30,y:450}]
        },
        {
            name: "Vạn Kiếp Hỏa Sơn (Map 2)",
            bgColor: "#1a0d0d",
            pathColor: "#331a1a",
            path: [{x:200,y:20},{x:200,y:120},{x:50,y:120},{x:50,y:380},{x:350,y:380},{x:350,y:220},{x:200,y:220},{x:200,y:480}]
        }
    ];

    let canvas = document.getElementById('gameCanvas');
    let ctx = canvas.getContext('2d');

    function resizeCanvas() {
        let container = document.getElementById('canvas-container');
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    let enemies = [];
    let towers = [];
    let bullets = [];
    let selectedType = null;
    let selectedCost = 0;
    let activeTower = null;

    function spawnEnemy() {
        let currentMap = maps[state.mapIndex];
        let isBoss = (state.wave === state.maxWave && enemies.length === 0);
        
        enemies.push({
            x: currentMap.path[0].x, y: currentMap.path[0].y,
            pathIndex: 0,
            isBoss: isBoss,
            hp: isBoss ? (400 + state.wave * 120) : (70 + state.wave * 35),
            maxHp: isBoss ? (400 + state.wave * 120) : (70 + state.wave * 35),
            speed: isBoss ? 0.9 : (1.1 + state.wave * 0.08),
            size: isBoss ? 42 : 28
        });
    }

    setInterval(() => {
        if(enemies.length < 6) spawnEnemy();
    }, 2200);

    function selectTowerType(type, cost) {
        selectedType = type;
        selectedCost = cost;
        alert(`Đã chọn Tháp. Chạm lên ô trống trên bản đồ để đặt!`);
    }

    canvas.addEventListener('click', (e) => {
        let rect = canvas.getBoundingClientRect();
        let x = e.clientX - rect.left;
        let y = e.clientY - rect.top;

        // Kiểm tra click vào trụ sẵn có để Nâng Cấp
        let clickedTower = towers.find(t => Math.hypot(t.x - x, t.y - y) < 22);
        if(clickedTower) {
            activeTower = clickedTower;
            showUpgradePanel(clickedTower);
            return;
        }

        closeUpgradePanel();

        // Đặt trụ mới
        if(selectedType) {
            if(state.gold >= selectedCost) {
                state.gold -= selectedCost;
                towers.push({ x: x, y: y, type: selectedType, level: 1, range: 95, atk: 25, cooldown: 0 });
                selectedType = null;
                updateHUD();
            } else {
                alert("Không đủ Vàng!");
            }
        }
    });

    function showUpgradePanel(t) {
        let panel = document.getElementById('upgrade-panel');
        document.getElementById('upgrade-info').innerText = `Tháp Cấp ${t.level}`;
        document.getElementById('upgrade-cost').innerText = t.level * 80;
        panel.style.display = 'flex';
    }

    function closeUpgradePanel() {
        document.getElementById('upgrade-panel').style.display = 'none';
        activeTower = null;
    }

    function upgradeSelectedTower() {
        if(!activeTower) return;
        let cost = activeTower.level * 80;
        if(state.gold >= cost) {
            state.gold -= cost;
            activeTower.level++;
            activeTower.atk += 20;
            activeTower.range += 10;
            updateHUD();
            showUpgradePanel(activeTower);
            alert("Nâng cấp Tháp thành công!");
        } else {
            alert("Không đủ Vàng để nâng cấp!");
        }
    }

    function gameLoop() {
        let currentMap = maps[state.mapIndex];
        ctx.fillStyle = currentMap.bgColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 1. Vẽ Đường Đi
        ctx.strokeStyle = currentMap.pathColor;
        ctx.lineWidth = 32;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(currentMap.path[0].x, currentMap.path[0].y);
        for(let i=1; i<currentMap.path.length; i++) ctx.lineTo(currentMap.path[i].x, currentMap.path[i].y);
        ctx.stroke();

        // 2. Cập nhật & Vẽ Yêu Thú / BOSS (Hình Sprite)
        for(let i = enemies.length - 1; i >= 0; i--) {
            let en = enemies[i];
            let target = currentMap.path[en.pathIndex + 1];
            if(!target) {
                enemies.splice(i, 1);
                state.life--;
                if(state.life <= 0) {
                    alert("Căn cứ bị phá hủy! Reset chơi lại.");
                    state.life = 20; state.wave = 1; state.mapIndex = 0;
                }
                updateHUD();
                continue;
            }

            let dx = target.x - en.x;
            let dy = target.y - en.y;
            let dist = Math.hypot(dx, dy);
            if(dist < en.speed) en.pathIndex++;
            else {
                en.x += (dx / dist) * en.speed;
                en.y += (dy / dist) * en.speed;
            }

            // Vẽ Sprite hình ảnh Quái/BOSS
            let img = en.isBoss ? images.boss : images.monster;
            if(img.complete) {
                ctx.drawImage(img, en.x - en.size/2, en.y - en.size/2, en.size, en.size);
            }

            // Thanh Máu
            ctx.fillStyle = '#111';
            ctx.fillRect(en.x - 16, en.y - en.size/2 - 8, 32, 5);
            ctx.fillStyle = en.isBoss ? '#ffd700' : '#ff4757';
            ctx.fillRect(en.x - 16, en.y - en.size/2 - 8, (en.hp / en.maxHp) * 32, 5);
        }

        // 3. Cập nhật & Vẽ Trụ (Hình Sprite)
        towers.forEach(t => {
            let imgKey = t.type === 'sword' ? 'towerSword' : (t.type === 'thunder' ? 'towerThunder' : 'towerIce');
            if(images[imgKey].complete) {
                ctx.drawImage(images[imgKey], t.x - 18, t.y - 18, 36, 36);
            }

            // Vòng Cấp Độ Trụ
            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 10px Arial';
            ctx.fillText(`Lv.${t.level}`, t.x - 10, t.y + 26);

            // Tìm quái bắn đạn
            if(t.cooldown > 0) t.cooldown--;
            else {
                let target = enemies.find(en => Math.hypot(en.x - t.x, en.y - t.y) < t.range);
                if(target) {
                    let totalDmg = t.atk * state.atkBuff;
                    target.hp -= totalDmg;
                    t.cooldown = Math.max(15, 35 - t.level * 3);

                    bullets.push({x1: t.x, y1: t.y, x2: target.x, y2: target.y, alpha: 1.0});

                    if(target.hp <= 0) {
                        state.gold += target.isBoss ? 100 : 25;
                        
                        // TỈ LỆ RỚT ĐỒ VIP 1%
                        if(Math.random() <= 0.01) {
                            state.inventory.push("⚔️ Thần Binh Ỷ Thiên Kiếm (Drop 1%)");
                            alert("🌟 BẠN NHẶT ĐƯỢC THẦN BINH Ỷ THIÊN KIẾM (Tỉ lệ 1%)!");
                        }

                        let idx = enemies.indexOf(target);
                        if(idx > -1) enemies.splice(idx, 1);

                        // Qua Wave / Qua Map
                        if(enemies.length === 0) {
                            state.wave++;
                            if(state.wave > state.maxWave) {
                                if(state.mapIndex < maps.length - 1) {
                                    state.mapIndex++;
                                    state.wave = 1;
                                    towers = [];
                                    alert(`🎉 CHÚC MỪNG QUẢN MÀN! Chuyển sang ${maps[state.mapIndex].name}!`);
                                } else {
                                    alert("🏆 CHÚC MỪNG BẠN ĐÃ PHÁ ĐẢO TOÀN BỘ GAME!");
                                }
                            }
                        }
                        updateHUD();
                    }
                }
            }
        });

        // 4. Tia Đạn Hiệu Ứng
        for(let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            ctx.strokeStyle = '#00a8ff';
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
            b.alpha -= 0.15;
            if(b.alpha <= 0) bullets.splice(i, 1);
        }

        requestAnimationFrame(gameLoop);
    }

    function updateHUD() {
        document.getElementById('txt-map').innerText = `Map ${state.mapIndex + 1}`;
        document.getElementById('txt-life').innerText = state.life;
        document.getElementById('txt-wave').innerText = `${state.wave}/${state.maxWave}`;
        document.getElementById('txt-gold').innerText = state.gold;
        document.getElementById('txt-gem').innerText = state.gem;

        let bagList = document.getElementById('bag-list');
        bagList.innerHTML = `<p style="font-size:11px; color:#888; text-align:center;">Trang bị nhận từ thủ trụ.</p>`;
        state.inventory.forEach(item => {
            let div = document.createElement('div');
            div.className = 'item-card';
            div.innerHTML = `<div class="item-desc"><h4>${item}</h4></div>`;
            bagList.appendChild(div);
        });
    }

    function openModal(id) {
        closeAllModals();
        document.getElementById(`modal-${id}`).classList.add('active');
    }
    function closeAllModals() {
        document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
    }

    function topup(gems, price) {
        if (confirm(`Xác nhận nạp ${price}?`)) {
            state.gem += gems;
            updateHUD();
            alert("Thanh toán thành công!");
        }
    }

    function buyShopItem(cost) {
        if(state.gem < cost) { alert("Không đủ Kim Cương!"); return; }
        state.gem -= cost;
        state.atkBuff += 1.0;
        state.inventory.push("⚔️ Thần Binh Ỷ Thiên Kiếm (Shop)");
        updateHUD();
        alert("Mua thành công! +100% Sát thương toàn bộ trụ!");
    }

    window.onload = () => {
        resizeCanvas();
        updateHUD();
        gameLoop();
    };
</script>
</body>
</html>
