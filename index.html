<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tiên Nghịch Mobile - Tu Tiên AFK</title>
    <!-- Thư viện Đồ họa Phaser 3 Engine chuyên nghiệp cho Web Game Mobile -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #050508; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        #game-wrapper { width: 100%; max-width: 430px; height: 100vh; max-height: 932px; background: #0d0e12; display: flex; flex-direction: column; position: relative; border: 1px solid #2a2b36; overflow: hidden; }
        
        /* Top UIBar thương mại */
        #top-bar { background: linear-gradient(180deg, rgba(20,21,29,0.95), rgba(13,14,18,0.9)); padding: 10px 14px; border-bottom: 1px solid #ffcc0044; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
        .user-header { display: flex; justify-content: space-between; align-items: center; }
        .realm-title { font-weight: bold; color: #ffd700; font-size: 14px; text-shadow: 0 0 8px rgba(255,215,0,0.5); }
        .currency-group { display: flex; gap: 10px; font-size: 12px; font-weight: bold; }
        .badge { background: #181a22; padding: 3px 8px; border-radius: 12px; border: 1px solid #333; display: flex; align-items: center; gap: 4px; }
        
        .bar-container { display: flex; flex-direction: column; gap: 3px; font-size: 10px; color: #aaa; }
        .progress-track { width: 100%; height: 7px; background: #1a1a22; border-radius: 4px; overflow: hidden; border: 1px solid #333; }
        .progress-fill { height: 100%; transition: width 0.2s; }
        .hp-bar { background: linear-gradient(90deg, #ff4757, #ff6b81); }
        .exp-bar { background: linear-gradient(90deg, #ffa502, #ffdd59); }

        /* Canvas Phaser Game Screen */
        #phaser-container { flex: 1; width: 100%; height: 100%; position: relative; }

        /* Bottom UI Controls & Nav */
        #bottom-panel { position: absolute; bottom: 0; left: 0; width: 100%; z-index: 5; background: linear-gradient(0deg, rgba(13,14,18,0.95) 80%, transparent); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .action-row { display: flex; gap: 8px; }
        .btn-game { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; text-shadow: 0 1px 2px #000; }
        .btn-skill { background: linear-gradient(135deg, #ff4757, #e84118); color: #fff; box-shadow: 0 4px 12px rgba(232, 65, 24, 0.4); }
        .btn-auto { background: linear-gradient(135deg, #44bd32, #4cd137); color: #fff; }
        .btn-auto.active { background: linear-gradient(135deg, #e1b12c, #fbc531); }

        nav { display: flex; justify-content: space-around; background: #14151d; border-top: 1px solid #2a2b36; padding: 6px 0; }
        .nav-item { background: none; border: none; color: #888; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; width: 25%; }
        .nav-item.active { color: #ffd700; }
        .nav-icon { font-size: 18px; }

        /* Modals (Cửa Hàng, Túi Đồ, Nạp Thẻ) */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,10,15,0.95); z-index: 10; display: none; flex-direction: column; }
        .modal-overlay.active { display: flex; }
        .modal-hdr { padding: 14px; background: #181a24; border-bottom: 1px solid #ffcc0033; display: flex; justify-content: space-between; align-items: center; }
        .modal-hdr h3 { color: #ffd700; font-size: 15px; }
        .btn-close { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }
        .modal-bdy { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }

        .item-card { background: #161822; border: 1px solid #2a2b36; border-radius: 8px; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
        .item-desc h4 { font-size: 13px; color: #fff; }
        .item-desc p { font-size: 10px; color: #aaa; margin-top: 2px; }
        .btn-buy { background: #fbc531; color: #000; border: none; padding: 6px 12px; border-radius: 5px; font-weight: bold; font-size: 11px; }
        .btn-topup { background: #00a8ff; color: #fff; border: none; padding: 6px 12px; border-radius: 5px; font-weight: bold; font-size: 11px; }

        .rate-tag { font-size: 9px; color: #ff4757; font-weight: bold; }
    </style>
</head>
<body>

<div id="game-wrapper">
    <!-- Top Bar HUD -->
    <div id="top-bar">
        <div class="user-header">
            <div class="realm-title" id="txt-realm">Tiên Nhân - Cảnh Giới 1</div>
            <div class="currency-group">
                <div class="badge"><span style="color:#fbc531">🪙</span> <span id="txt-gold">500</span></div>
                <div class="badge"><span style="color:#00a8ff">💎</span> <span id="txt-gem">100</span></div>
            </div>
        </div>
        <div class="bar-container">
            <div style="display:flex; justify-content:space-between;">
                <span>Sinh Lực (HP)</span>
                <span id="txt-hp-num">100/100</span>
            </div>
            <div class="progress-track"><div id="bar-hp" class="progress-fill hp-bar" style="width:100%;"></div></div>
            <div style="display:flex; justify-content:space-between;">
                <span>Tu Vi (EXP)</span>
                <span id="txt-exp-num">0%</span>
            </div>
            <div class="progress-track"><div id="bar-exp" class="progress-fill exp-bar" style="width:0%;"></div></div>
        </div>
    </div>

    <!-- Màn hình Đồ Họa Phaser 3 Engine -->
    <div id="phaser-container"></div>

    <!-- Bảng Điều Khiển Dưới Cùng -->
    <div id="bottom-panel">
        <div class="action-row">
            <button class="btn-game btn-skill" onclick="playerSkill()">THIỆN ĐỊA TRẢM</button>
            <button class="btn-game btn-auto" id="btn-auto-toggle" onclick="toggleAuto()">TREO MÁY: TẮT</button>
        </div>

            <button class="nav-item" onclick="openModal('bag')"><span class="nav-icon">🎒</span><span>Túi Đồ</span></button>
