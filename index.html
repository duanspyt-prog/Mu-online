<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tiên Hiệp Thủ Trụ - Tower Defense Mobile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #050508; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        #game-wrapper { width: 100%; max-width: 430px; height: 100vh; max-height: 932px; background: #0d0e12; display: flex; flex-direction: column; position: relative; border: 1px solid #2a2b36; overflow: hidden; }
        
        /* Top Bar HUD */
        #top-bar { background: linear-gradient(180deg, rgba(20,21,29,0.95), rgba(13,14,18,0.9)); padding: 10px 14px; border-bottom: 1px solid #ffcc0044; display: flex; justify-content: space-between; align-items: center; z-index: 5; }
        .hud-group { display: flex; gap: 8px; font-size: 11px; font-weight: bold; }
        .badge { background: #181a22; padding: 4px 8px; border-radius: 10px; border: 1px solid #333; display: flex; align-items: center; gap: 4px; }
        
        /* Màn hình Canvas Thủ Trụ */
        #canvas-container { flex: 1; width: 100%; position: relative; background: #131722; display: flex; justify-content: center; align-items: center; }
        canvas { width: 100%; height: 100%; display: block; }

        /* Bảng Điều Khiển Xây Trụ Dưới Cùng */
        #bottom-panel { position: absolute; bottom: 0; left: 0; width: 100%; z-index: 5; background: linear-gradient(0deg, rgba(13,14,18,0.98) 90%, transparent); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .build-row { display: flex; gap: 8px; justify-content: space-between; }
        .btn-build { flex: 1; padding: 10px 4px; background: #1f2233; border: 1px solid #ffcc0044; border-radius: 8px; color: #fff; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; }
        .btn-build span { display: block; font-size: 9px; color: #fbc531; margin-top: 2px; }
        .btn-build:active { background: #2f344a; }

        nav { display: flex; justify-content: space-around; background: #14151d; border-top: 1px solid #2a2b36; padding: 6px 0; }
        .nav-item { background: none; border: none; color: #888; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; width: 25%; }
        .nav-item.active { color: #ffd700; font-weight: bold; }
        .nav-icon { font-size: 18px; }

        /* Modals */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,10,15,0.96); z-index: 10; display: none; flex-direction: column; }
        .modal-overlay.active { display: flex; }
        .modal-hdr { padding: 14px; background: #181a24; border-bottom: 1px solid #ffcc0033; display: flex; justify-content: space-between; align-items: center; }
        .modal-hdr h3 { color: #ffd700; font-size: 15px; }
        .btn-close { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }
        .modal-bdy { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }

        .item-card { background: #161822; border: 1px solid #2a2b36; border-radius: 8px; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
        .item-desc h4 { font-size: 13px; color: #fff; }
        .item-desc p { font-size: 10px; color: #aaa; margin-top: 2px; }
        .btn-buy { background: #fbc531; color: #000; border: none; padding: 6px 12px; border-radius: 5px; font-weight: bold; font-size: 11px; }
        .btn-topup { background: #00a8ff; color: #fff; border: none; padding: 6px 12px; border-radius: 5px; font-weight: bold; font-size: 11px; }
    </style>
</head>
<body>

<div id="game-wrapper">
    <!-- Top Bar HUD -->
    <div id="top-bar">
        <div class="hud-group">
            <div class="badge">❤️ <span id="txt-life">20</span></div>
            <div class="badge">🌊 Wave <span id="txt-wave">1</span></div>
        </div>
        <div class="hud-group">
            <div class="badge"><span style="color:#fbc531">🪙</span> <span id="txt-gold">150</span></div>
            <div class="badge"><span style="color:#00a8ff">💎</span> <span id="txt-gem">50</span></div>
        </div>
    </div>

    <!-- Màn hình Canvas Game Thủ Trụ -->
    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Bảng Xây Trụ & Điều Hướng -->
    <div id="bottom-panel">
        <div class="build-row">
            <button class="btn-build" onclick="selectTowerType('剑', 50)">⚔️ Kiếm Tháp<span>50 Vàng</span></button>
            <button class="btn-build" onclick="selectTowerType('雷', 80)">⚡ Lôi Trụ<span>80 Vàng</span></button>
            <button class="btn-build" onclick="selectTowerType('冰', 70)">❄️ Băng Trận<span>70 Vàng</span></button>
        </div>
        <nav>
            <button class="nav-item active" onclick="closeAllModals()"><span class="nav-icon">🏰</span><span>Thủ Trụ</span></button>
            <button class="nav-item" onclick="openModal('bag')"><span class="nav-icon">🎒</span><span>Túi Đồ</span></button>
            <button class="nav-item" onclick="openModal('shop')"><span class="nav-icon">🏪</span><span>Cửa Hàng</span></button>
            <button class="nav-item" onclick="openModal('topup')"><span class="nav-icon">💳</span><span>Nạp Thẻ</span></button>
        </nav>
    </div>

    <!-- Modal Túi Đồ -->
    <div class="modal-overlay" id="modal-bag">
        <div class="modal-hdr">
            <h3>Túi Đồ Trang Bị (Drop 1%)</h3>
            <button class="btn-close" onclick="closeAllModals()">✕</button>
        </div>
        <div class="modal-bdy" id="bag-list">
            <p style="font-size:11px; color:#888; text-align:center;">Tiêu diệt Yêu Thú nhận trang bị hiếm.</p>
        </div>
    </div>

    <!-- Modal Cửa Hàng -->
    <div class="modal-overlay" id="modal-shop">
        <div class="modal-hdr">
            <h3>Cửa Hàng Tiên Các</h3>
            <button class="btn-close" onclick="closeAllModals()">✕</button>
        </div>
        <div class="modal-bdy">
            <div class="item-card">
                <div class="item-desc">
                    <h4>⚔️ Thần Binh Ỷ Thiên Kiếm</h4>
                    <p>Tăng cường sức mạnh toàn bộ Tháp</p>
                </div>
                <button class="btn-buy" onclick="buyShopItem(200)">200 💎</button>
            </div>
        </div>
    </div>

    <!-- Modal Nạp Thẻ -->
    <div class="modal-overlay" id="modal-topup">
        <div class="modal-hdr">
            <h3>Nạp Kim Cương</h3>
            <button class="btn-close" onclick="closeAllModals()">✕</button>
        </div>
        <div class="modal-bdy">
            <div class="item-card">
                <div class="item-desc">
                    <h4>💎 Gói Tiên Thạch</h4>
                    <p>Nhận ngay 200 Kim Cương</p>
                </div>
                <button class="btn-topup" onclick="topup(200, '20.000 VNĐ')">20.000đ</button>
            </div>
        </div>
    </div>
</div>

<script>
    let state = {
        gold: 150, gem: 50, life: 20, wave: 1,
        inventory: [], atkBuff: 1
    };

    let canvas = document.getElementById('gameCanvas');
    let ctx = canvas.getContext('2d');

    function resizeCanvas() {
        let container = document.getElementById('canvas-container');
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    // Đường đi của Yêu Thú (Winding Path)
    const path = [
        {x: 40, y: 40}, {x: 350, y: 40},
        {x: 350, y: 180}, {x: 80, y: 180},
        {x: 80, y: 320}, {x: 350, y: 320},
        {x: 350, y: 460}, {x: 40, y: 460}
    ];

    let enemies = [];
    let towers = [];
    let bullets = [];
    let selectedTowerType = null;
    let selectedTowerCost = 0;

    function spawnEnemy() {
        enemies.push({
            x: path[0].x, y: path[0].y,
            pathIndex: 0,
            hp: 60 + state.wave * 25,
            maxHp: 60 + state.wave * 25,
            speed: 1.2 + state.wave * 0.1,
            radius: 10
        });
    }

    // Tự động sinh quái theo đợt
    setInterval(() => {
        if(enemies.length < 5) spawnEnemy();
    }, 2500);

    function selectTowerType(type, cost) {
        selectedTowerType = type;
        selectedTowerCost = cost;
        alert(`Đã chọn ${type} Tháp. Chạm lên bản đồ để đặt trụ!`);
    }

    canvas.addEventListener('click', (e) => {
        let rect = canvas.getBoundingClientRect();
        let x = e.clientX - rect.left;
        let y = e.clientY - rect.top;

        if(selectedTowerType) {
            if(state.gold >= selectedTowerCost) {
                state.gold -= selectedTowerCost;
                towers.push({ x: x, y: y, type: selectedTowerType, range: 90, cooldown: 0 });
                selectedTowerType = null;
                updateHUD();
            } else {
                alert("Không đủ vàng để xây trụ!");
            }
        }
    });

    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Vẽ Đường Đi Yêu Thú
        ctx.strokeStyle = '#23283d';
        ctx.lineWidth = 28;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(path[0].x, path[0].y);
        for(let i=1; i<path.length; i++) ctx.lineTo(path[i].x, path[i].y);
        ctx.stroke();

        // 2. Cập nhật & Vẽ Yêu Thú
        for(let i = enemies.length - 1; i >= 0; i--) {
            let en = enemies[i];
            let target = path[en.pathIndex + 1];
            if(!target) {
                enemies.splice(i, 1);
                state.life--;
                if(state.life <= 0) {
                    alert("Thủ thành thất bại! Đang reset màn chơi...");
                    state.life = 20; state.wave = 1; state.gold = 150;
                }
                updateHUD();
                continue;
            }

            let dx = target.x - en.x;
            let dy = target.y - en.y;
            let dist = Math.hypot(dx, dy);
            if(dist < en.speed) {
                en.pathIndex++;
            } else {
                en.x += (dx / dist) * en.speed;
                en.y += (dy / dist) * en.speed;
            }

            // Vẽ quái
            ctx.beginPath();
            ctx.arc(en.x, en.y, en.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ff4757';
            ctx.fill();

            // Thanh máu quái
            ctx.fillStyle = '#111';
            ctx.fillRect(en.x - 14, en.y - 18, 28, 4);
            ctx.fillStyle = '#2ed573';
            ctx.fillRect(en.x - 14, en.y - 18, (en.hp / en.maxHp) * 28, 4);
        }

        // 3. Cập nhật & Vẽ Trụ Phòng Thủ
        towers.forEach(t => {
            ctx.beginPath();
            ctx.arc(t.x, t.y, 18, 0, Math.PI * 2);
            ctx.fillStyle = '#ffcc00';
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(t.type, t.x, t.y + 4);

            // Bắn đạn tìm quái gần nhất
            if(t.cooldown > 0) t.cooldown--;
            else {
                let target = enemies.find(en => Math.hypot(en.x - t.x, en.y - t.y) < t.range);
                if(target) {
                    target.hp -= 25 * state.atkBuff;
                    t.cooldown = 40;

                    // Hiệu ứng tia sét/đạn bắn
                    bullets.push({x1: t.x, y1: t.y, x2: target.x, y2: target.y, alpha: 1.0});

                    if(target.hp <= 0) {
                        state.gold += 20;
                        // Tỉ lệ rớt đồ VIP 1%
                        if(Math.random() <= 0.01) {
                            state.inventory.push("⚔️ Thần Binh Ỷ Thiên Kiếm (Drop 1%)");
                            alert("🌟 NHẶT ĐƯỢC THẦN BINH Ỷ THIÊN KIẾM (Tỉ lệ 1%)!");
                        }
                        let idx = enemies.indexOf(target);
                        if(idx > -1) enemies.splice(idx, 1);
                        updateHUD();
                    }
                }
            }
        });

        // 4. Vẽ hiệu ứng đạn
        for(let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            ctx.strokeStyle = '#00a8ff';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
            b.alpha -= 0.1;
            if(b.alpha <= 0) bullets.splice(i, 1);
        }

        requestAnimationFrame(gameLoop);
    }

    function updateHUD() {
        document.getElementById('txt-life').innerText = state.life;
        document.getElementById('txt-wave').innerText = state.wave;
        document.getElementById('txt-gold').innerText = state.gold;
        document.getElementById('txt-gem').innerText = state.gem;

        let bagList = document.getElementById('bag-list');
        bagList.innerHTML = `<p style="font-size:11px; color:#888; text-align:center;">Trang bị nhận từ thủ trụ.</p>`;
        state.inventory.forEach(item => {
            let div = document.createElement('div');
            div.className = 'item-card';
            div.innerHTML = `<div class="item-desc"><h4>${item}</h4></div>`;
            bagList.appendChild(div);
        });
    }

    function openModal(id) {
        closeAllModals();
        document.getElementById(`modal-${id}`).classList.add('active');
    }
    function closeAllModals() {
        document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
    }

    function topup(gems, price) {
        if (confirm(`Xác nhận nạp ${price}?`)) {
            state.gem += gems;
            updateHUD();
            alert("Thanh toán thành công!");
        }
    }

    function buyShopItem(cost) {
        if(state.gem < cost) { alert("Không đủ Kim Cương!"); return; }
        state.gem -= cost;
        state.atkBuff += 0.5;
        state.inventory.push("⚔️ Thần Binh Ỷ Thiên Kiếm (Shop)");
        updateHUD();
        alert("Mua thành công, tăng sát thương tháp!");
    }

    window.onload = () => {
        resizeCanvas();
        updateHUD();
        gameLoop();
    };
</script>
</body>
</html>
